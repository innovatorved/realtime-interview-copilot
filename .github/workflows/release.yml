name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v0.4.0-beta). Will be created if it does not exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_glob: "dist/*.dmg dist/*.zip dist/*.blockmap dist/*.yml"
          - os: windows-latest
            artifact_glob: "dist/*.exe dist/*.blockmap dist/*.yml"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node (for electron-builder tooling)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trust postinstall scripts
        # Explicitly allowlist only the native modules that need postinstall
        # scripts to build binaries. Avoid `--all`, which runs postinstall
        # hooks from every transitive dep and is a supply-chain footgun.
        shell: bash
        run: |
          set -euo pipefail
          for pkg in electron electron-winstaller @biomejs/biome @tailwindcss/oxide esbuild sharp core-js unrs-resolver protobufjs workerd; do
            bun pm trust "$pkg" || true
          done

      - name: Build Electron main + preload
        run: bun run build:electron

      - name: Build Next.js frontend
        run: bun run build

      - name: Package app (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code-signing / notarization for open-source beta builds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder --publish never

      - name: Verify macOS microphone entitlement
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -name '*.app' -type d | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found under dist/"
            exit 1
          fi
          echo "Inspecting $app_path"
          # Unsigned beta builds (CSC_IDENTITY_AUTO_DISCOVERY=false) do not embed
          # entitlements via codesign. Mic access is declared in Info.plist and
          # configured in build/entitlements.mac*.plist for when signing is enabled.
          plutil -p "$app_path/Contents/Info.plist" | grep -q "NSMicrophoneUsageDescription"
          grep -q "com.apple.security.device.audio-input" build/entitlements.mac.plist
          grep -q "com.apple.security.device.audio-input" build/entitlements.mac.inherit.plist
          echo "Microphone Info.plist + entitlements config verified."

      - name: List built artifacts
        shell: bash
        run: ls -lh dist/ || dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: false
          # Mark only alpha / rc pre-releases as prerelease; beta builds are
          # promoted to the "Latest" channel so users see them on the Releases
          # page by default.
          prerelease: ${{ contains(steps.tag.outputs.name, 'alpha') || contains(steps.tag.outputs.name, 'rc') }}
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml

  tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Skip gracefully when the tap token is not configured so this job never
    # blocks a release; maintainers can still bump the cask manually.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate cask with new version + sha256
        env:
          # workflow_dispatch uses the branch ref for GITHUB_REF_NAME; this is the real release tag.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/update-homebrew-cask.js

      - name: Check for tap token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap push. Cask was regenerated locally under homebrew/Casks/."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push cask to innovatorved/homebrew-tap
        if: steps.token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/innovatorved/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          cp homebrew/Casks/realtime-interview-copilot.rb "$TAP_DIR/Casks/realtime-interview-copilot.rb"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/realtime-interview-copilot.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
            exit 0
          fi
          git commit -m "realtime-interview-copilot: bump cask for ${{ needs.release.outputs.tag || github.ref_name }}"
          git push origin HEAD

  winget:
    name: Update winget manifests
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate winget manifests with new version + sha256
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/update-winget-manifest.js

      - name: Check for winget token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_MANIFEST_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_MANIFEST_TOKEN / HOMEBREW_TAP_TOKEN not set — skipping winget push. Manifests were regenerated locally under winget/."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push manifests to innovatorved/winget
        if: steps.token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_MANIFEST_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WINGET_DIR="$RUNNER_TEMP/winget"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/innovatorved/winget.git" "$WINGET_DIR"
          mkdir -p "$WINGET_DIR/manifests/i/Innovatorved/RealtimeInterviewCopilot"
          mkdir -p "$WINGET_DIR/packages/RealtimeInterviewCopilot"
          rsync -a --delete winget/manifests/i/Innovatorved/RealtimeInterviewCopilot/ "$WINGET_DIR/manifests/i/Innovatorved/RealtimeInterviewCopilot/"
          rsync -a winget/packages/RealtimeInterviewCopilot/ "$WINGET_DIR/packages/RealtimeInterviewCopilot/"
          cp winget/install.ps1 "$WINGET_DIR/install.ps1"
          cp winget/install-realtime-interview-copilot.ps1 "$WINGET_DIR/install-realtime-interview-copilot.ps1"
          cp winget/hub/README.md "$WINGET_DIR/README.md"
          cd "$WINGET_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests packages install.ps1 install-realtime-interview-copilot.ps1 README.md
          if git diff --cached --quiet; then
            echo "No winget hub changes to commit."
            exit 0
          fi
          git commit -m "realtime-interview-copilot: bump manifests for ${{ needs.release.outputs.tag || github.ref_name }}"
          git push origin HEAD
